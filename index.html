<script>
const firebaseConfig = {
  apiKey: "AIzaSyADn_HUkP4ZfTOQ46eoQdXKIY7VAKd6odI",
  authDomain: "debit-4db50.firebaseapp.com",
  databaseURL: "https://debit-4db50-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "debit-4db50",
  storageBucket: "debit-4db50.appspot.com",
  messagingSenderId: "495330105885",
  appId: "1:495330105885:web:18436900b881a1ee6b84f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentPath = "";
let allData = {};
let descSuggestions = new Set();

function formatDate(dateStr) {
  if (!dateStr) return "";
  const [year, month, day] = dateStr.split("-");
  return `${parseInt(day)}-${parseInt(month)}\n${year}`;
}

function openLedger(type){
  currentPath = type;
  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('ledgerScreen').classList.add('active');
  const title = type === 'kharchKhata' ? "खर्चा खाता" : "बैंक खाता";
  document.getElementById('ledgerTitle').innerText = title;
  document.getElementById('printLedgerTitle').innerText = "(" + title + ")";
  loadLedger();
}

function goHome(){
  document.getElementById('ledgerScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
}

function openPopup(){
  document.getElementById("popupForm").style.display = "flex";
  document.getElementById("popupTitle").innerText = "नई एंट्री जोड़ें";
  document.getElementById("date").value = new Date().toISOString().split('T')[0];
  document.getElementById("desc").value = "";
  document.getElementById("credit").value = "0";
  document.getElementById("debit").value = "0";
  
  // Reset Save Button to saveNew
  const saveBtn = document.getElementById("saveButton");
  saveBtn.onclick = saveNew;
  saveBtn.innerText = "💾 SAVE";
  
  updateDescList();
}

function closePopup(){
  document.getElementById("popupForm").style.display = "none";
}

function saveNew(){
  const data = {
    date: document.getElementById("date").value,
    desc: document.getElementById("desc").value.trim(),
    credit: Number(document.getElementById("credit").value),
    debit: Number(document.getElementById("debit").value),
    timestamp: Date.now()
  };
  if(!data.desc) return alert("विवरण दर्ज करें!");
  db.ref(currentPath).push(data);
  closePopup();
}

function updateDescList(){
  const list = document.getElementById("descList");
  list.innerHTML = "";
  descSuggestions.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    list.appendChild(option);
  });
}

function loadLedger(){
  db.ref(currentPath).on("value", snap=>{
    allData = snap.val() || {};
    renderTable();
  });
}

function deleteEntry(id) {
  if (confirm("क्या आप वाकई इस एंट्री को डिलीट करना चाहते हैं?")) {
    db.ref(`${currentPath}/${id}`).remove();
  }
}

function renderTable(){
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  const search = document.getElementById("searchBox").value.toLowerCase();
  const sortType = document.getElementById("sortFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;
  const tbody = document.querySelector("#ledgerTable tbody");
  tbody.innerHTML = "";

  let entries = Object.keys(allData).map(id => ({ id, ...allData[id] }));

  descSuggestions.clear();
  Object.values(allData).forEach(e => {
    if (e.desc) descSuggestions.add(e.desc);
  });
  updateDescList();

  entries = entries.filter(e => {
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    if (search && !e.desc.toLowerCase().includes(search)) return false;
    if (typeFilter === "credit" && e.credit <= 0) return false;
    if (typeFilter === "debit" && e.debit <= 0) return false;
    return true;
  });

  entries.sort((a, b) => {
    const da = Number(a.date.replace(/-/g, ""));
    const db = Number(b.date.replace(/-/g, ""));
    if (da !== db) return sortType === "new" ? db - da : da - db;
    
    const ta = a.timestamp || 0;
    const tb = b.timestamp || 0;
    if (ta !== tb) return sortType === "new" ? tb - ta : ta - tb;

    return sortType === "new" ? b.id.localeCompare(a.id) : a.id.localeCompare(b.id);
  });

  let tc = 0, td = 0;

  entries.forEach(e => {
    tc += e.credit;
    td += e.debit;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="td-date">${formatDate(e.date)}</td>
      <td class="customer-name">${e.desc}</td>
      <td class="credit">${e.credit}</td>
      <td class="debit">${e.debit}</td>
      <td>
        <button class="edit-btn" onclick="editEntry('${e.id}')">✏️</button>
        <button class="delete-btn" onclick="deleteEntry('${e.id}')">🗑️</button>
      </td>`;
    tbody.appendChild(tr);
  });

  document.getElementById("creditTotal").innerText = tc;
  document.getElementById("debitTotal").innerText = td;
  document.getElementById("balance").innerText = tc - td;

  updateMainBalances();
}

function editEntry(id) {
  const entry = allData[id];
  if(!entry) return;

  document.getElementById("popupForm").style.display = "flex";
  document.getElementById("popupTitle").innerText = "एंट्री सुधारें";
  document.getElementById("date").value = entry.date;
  document.getElementById("desc").value = entry.desc;
  document.getElementById("credit").value = entry.credit;
  document.getElementById("debit").value = entry.debit;
  
  const saveBtn = document.getElementById("saveButton");
  saveBtn.innerText = "💾 UPDATE";
  saveBtn.onclick = () => {
    const updated = {
      date: document.getElementById("date").value,
      desc: document.getElementById("desc").value.trim(),
      credit: Number(document.getElementById("credit").value),
      debit: Number(document.getElementById("debit").value),
      timestamp: entry.timestamp || Date.now()
    };
    if(!updated.desc) return alert("विवरण दर्ज करें!");
    
    db.ref(`${currentPath}/${id}`).update(updated).then(closePopup);
  };
}

function updateMainBalances(){
  ["kharchKhata","bankKhata"].forEach(path=>{
    db.ref(path).once("value",snap=>{
      let tc=0,td=0;
      const data=snap.val()||{};
      Object.values(data).forEach(e=>{tc+=e.credit;td+=e.debit});
      const el = document.getElementById(path==="kharchKhata" ? "kharchBalance" : "bankBalance");
      if(el) el.innerText="₹"+(tc-td);
    });
  });
}

document.getElementById("fromDate").addEventListener("input", renderTable);
document.getElementById("toDate").addEventListener("input", renderTable);
document.getElementById("searchBox").addEventListener("input", renderTable);
document.getElementById("sortFilter").addEventListener("change", renderTable);
document.getElementById("typeFilter").addEventListener("change", renderTable);
updateMainBalances();

// ===== SECURITY SYSTEM SCRIPT =====
const MASTER_PASSWORD = "786786";

async function initSecurity() {
  if (!localStorage.getItem("app_pin")) {
    let initialPin = prompt("नया सुरक्षा PIN सेट करें (Set New Security PIN):", "1234");
    if (initialPin) {
      localStorage.setItem("app_pin", initialPin);
    }
  }
  
  // Check if WebAuthn is supported
  if (window.PublicKeyCredential) {
    // Initial attempt on load
    triggerFingerprint();
  } else {
    document.getElementById('fpBtn').style.display = 'none';
  }
}

// Fixed Fingerprint Function using navigator.credentials.get
async function triggerFingerprint() {
  try {
    if (!window.PublicKeyCredential) {
      alert("Biometric authentication is not supported on this device.");
      return;
    }

    const challenge = new Uint8Array(32);
    window.crypto.getRandomValues(challenge);

    // Using navigator.credentials.get for biometric unlocking
    const options = {
      publicKey: {
        challenge: challenge,
        timeout: 60000,
        userVerification: "required"
      }
    };

    const credential = await navigator.credentials.get(options);
    if (credential) {
      unlockApp();
    } else {
      alert("Fingerprint authentication failed");
    }
  } catch (err) {
    console.log("WebAuthn error:", err);
    // Silent fail for auto-trigger, alert only for manual button click if needed
    if(event && event.type === 'click') {
        alert("Fingerprint authentication failed");
    }
  }
}

function verifyPin() {
  const input = document.getElementById("pinInput").value;
  const stored = localStorage.getItem("app_pin");
  if (input === stored) {
    unlockApp();
  } else {
    alert("गलत PIN! कृपया पुनः प्रयास करें।");
    document.getElementById("pinInput").value = "";
  }
}

function unlockApp() {
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("pinInput").value = "";
}

function logout() {
  document.getElementById("lockScreen").style.display = "flex";
  triggerFingerprint();
}

function forgotPin() {
  const master = prompt("मास्टर पासवर्ड दर्ज करें (Enter Master Password):");
  if (master === MASTER_PASSWORD) {
    const newPin = prompt("नया PIN सेट करें (Set New PIN):");
    if (newPin) {
      localStorage.setItem("app_pin", newPin);
      alert("PIN सफलतापूर्वक बदल दिया गया है।");
    }
  } else {
    alert("गलत मास्टर पासवर्ड!");
  }
}

// ===== PRINT PREVIEW FUNCTIONS =====
function openCustomPreview() {
  const title = document.getElementById("ledgerTitle").innerText;
  const rows = document.querySelectorAll("#ledgerTable tbody tr");

  let html = `
    <h2 style="text-align:center;">SAINI TRADING COMPANY</h2>
    <h3 style="text-align:center;">(${title})</h3>
    <table style="width:100%;border-collapse:collapse;" border="1">
      <tr>
        <th>तारीख</th>
        <th>विवरण</th>
        <th>Credit</th>
        <th>Debit</th>
      </tr>
  `;

  rows.forEach(r => {
    const c = r.children;
    html += `
      <tr>
        <td>${c[0].innerText}</td>
        <td>${c[1].innerText}</td>
        <td>${c[2].innerText}</td>
        <td>${c[3].innerText}</td>
      </tr>`;
  });

  html += `</table>`;

  document.getElementById("previewContent").innerHTML = html;
  document.getElementById("printPreviewModal").style.display = "flex";
// ✅ ZOOM APPLY (CORRECT PLACE)
document.documentElement.style.setProperty("--p-zoom", 1);
document.getElementById("zoomRange").value = 1;
applyZoom();
document.getElementById("previewContent").style.transform = "scale(0.95)";
}


function closePreview(){
  document.getElementById("printPreviewModal").style.display = "none";
}
</script>

            inset:0;
            background:black;
            z-index:9999;
            overflow:auto;">
  <div style="background:white;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
  <button onclick="closePreview()">❌ Close</button>

  <div style="display:flex;align-items:center;gap:6px;">
    <b>Zoom</b>
    <input type="range"
           id="zoomRange"
           min="0.5"
           max="2"
           step="0.05"
           value="1"
           oninput="applyZoom()">
  </div>

  <button onclick="window.print()">🖨️ Print</button>
</div>
  <div id="previewContent" style="background:white;padding:10px;"></div>
</div>
</body>
</html>
