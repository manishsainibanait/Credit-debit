<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <script>
  if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
  }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>खर्चा खाता / बैंक खाता</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body {
    font-family: 'Noto Sans Devanagari', sans-serif;
    background: linear-gradient(135deg, #d1c4e9, #bbdefb);
    margin: 0; padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #512da8;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 22px;
  }
  .screen { display: none; padding: 20px; text-align: center; }
  .active { display: block; }

  .account-btn {
    display: block;
    background: #5cb85c;
    color: white;
    margin: 15px auto;
    padding: 15px;
    border-radius: 12px;
    width: 90%;
    font-size: 18px;
    font-weight: bold;
  }

  .balance-box {
    background: white;
    border-radius: 10px;
    padding: 12px;
    margin: 10px auto;
    width: 90%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 20px;
    position: sticky;
    top: 0;
    z-index: 999;
  }

  .credit { color: blue; font-weight: bold; }
  .debit { color: red; font-weight: bold; }
  .balance { color: #28a745; font-weight: bold; }

  .customer-name {
    font-weight: bold !important;
    color: #1a237e !important;
  }

  .td-date {
    white-space: pre-wrap;
    padding: 8px 2px !important;
    width: 1%;
    line-height: 1.2;
    font-size: 14px;
    text-align: center;
  }

  table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 8px;
    text-align: center;
  }
  th { background: #512da8; color: white; position: sticky; top: 0; z-index: 10; }

  button { border: none; border-radius: 6px; cursor: pointer; }
  .add-btn, .print-btn {
    background: #4caf50;
    color: white;
    padding: 12px;
    margin: 5px;
    width: 45%;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
  }
  .print-btn { background: #2196f3; }
  .edit-btn { background: #ff9800; color: white; padding: 6px 10px; }
  .delete-btn { background: #f44336; color: white; padding: 6px 10px; }
  
  .back-btn {
    background: #673ab7;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 16px;
  }

  .table-container {
    height: calc(100vh - 350px);
    overflow-y: auto;
  }

  .popup {
    display: none; justify-content: center; align-items: center;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
  }
  .popup-content {
    background: white;
    border-radius: 15px;
    padding: 20px;
    width: 90%; max-width: 360px;
  }
  .popup-btn-container {
    display: flex;
    justify-content: space-between; gap: 10px; margin-top: 20px;
  }
  .popup-btn {
    padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; flex: 1; color: white;
  }
  .save-btn { background: #4caf50; }
  .cancel-btn { background: #f44336; }

  input, select {
    width: 100%; padding: 12px; margin: 8px 0;
    border: 1px solid #ccc; border-radius: 8px;
    font-size: 16px; box-sizing: border-box;
  }

  #printHeaderOnly { display: none; }

  @media print {
    header, .back-btn, .add-btn, .print-btn, .popup, .account-btn, #homeScreen, 
    .balance-box, .filters, select, input, #ledgerScreen h2, .edit-btn, .delete-btn {
      display: none !important;
    }
    #printHeaderOnly {
      display: block !important;
      text-align: center;
      margin-bottom: 30px;
    }
    .print-company {
      color: #0d47a1 !important;
      font-size: 32px !important;
      font-weight: bold !important;
    }
    .table-container {
      overflow: visible !important;
      height: auto !important;
    }
    table { width: 100% !important; border: 2px solid black !important; }
    th, td {
      border: 1.5px solid black !important;
      color: black !important;
      font-size: 22px !important;
      padding: 12px 5px !important;
      font-weight: bold !important;
    }
    th { background-color: #f2f2f2 !important; }
  }
</style>
</head>
<body>

<header>💼 SAINI TRADING COMPANY</header>

<div class="screen active" id="homeScreen">
  <h2>खाते का सारांश</h2>
  <div id="balanceCards">
    <div class="balance-box">
      🧾 खर्चा खाता - <span class="balance" id="kharchBalance">₹0</span>
    </div>
    <div class="balance-box">
      🏦 बैंक खाता - <span class="balance" id="bankBalance">₹0</span>
    </div>
  </div>
  <button class="account-btn" onclick="openLedger('kharchKhata')">🧾 खर्चा खाता खोलें</button>
  <button class="account-btn" onclick="openLedger('bankKhata')">🏦 बैंक खाता खोलें</button>
</div>

<div class="screen" id="ledgerScreen">
  <button class="back-btn" onclick="goHome()">🔙 वापस जाएं</button>
  <h2 id="ledgerTitle"></h2>

  <div id="printHeaderOnly">
    <div class="print-company">SAINI TRADING COMPANY</div>
    <div style="font-size: 22px; font-weight: bold;" id="printLedgerTitle"></div>
  </div>

  <div class="balance-box">
    <span class="credit">Cr ₹<span id="creditTotal">0</span></span> | 
    <span class="debit">Db ₹<span id="debitTotal">0</span></span> |
    <span class="balance">Bal ₹<span id="balance">0</span></span>
  </div>

  <div class="filters">
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <input type="text" id="searchBox" placeholder="🔍 विवरण से खोजें...">
  </div>

  <div style="margin-bottom:10px; display: flex; justify-content: center; gap: 5px;">
    <select id="sortFilter" style="width: 48%;">
        <option value="new">📅 नया पहले</option>
        <option value="old">📅 पुराना पहले</option>
    </select>
    <select id="typeFilter" style="width: 48%;">
        <option value="">सभी</option>
        <option value="credit">Credit</option>
        <option value="debit">Debit</option>
    </select>
  </div>

  <div style="display: flex; justify-content: center;">
    <button class="add-btn" onclick="openPopup()">➕ नई Entry</button>
    <button class="print-btn" onclick="window.print()">🖨️ Print</button>
  </div>

  <div class="table-container">
    <table id="ledgerTable">
      <thead>
        <tr>
          <th>तारीख</th>
          <th>विवरण</th>
          <th>Credit</th>
          <th>Debit</th>
          <th class="action-cell">⚙️</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="popup" id="popupForm">
  <div class="popup-content">
    <h3 style="text-align:center;">नई एंट्री जोड़ें</h3>
    <label>तारीख</label>
    <input type="date" id="date">
    <label>विवरण (नाम)</label>
    <input list="descList" type="text" id="desc" placeholder="नाम लिखें...">
    <datalist id="descList"></datalist>
    <label style="color:blue;">💰 Credit राशि</label>
    <input type="number" id="credit" value="0">
    <label style="color:red;">💸 Debit राशि</label>
    <input type="number" id="debit" value="0">
    <div class="popup-btn-container">
      <button class="popup-btn save-btn" onclick="saveNew()">💾 SAVE</button>
      <button class="popup-btn cancel-btn" onclick="closePopup()">❌ CANCEL</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyADn_HUkP4ZfTOQ46eoQdXKIY7VAKd6odI",
  authDomain: "debit-4db50.firebaseapp.com",
  databaseURL: "https://debit-4db50-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "debit-4db50",
  storageBucket: "debit-4db50.appspot.com",
  messagingSenderId: "495330105885",
  appId: "1:495330105885:web:18436900b881a1ee6b84f4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentPath = "";
let allData = {};
let descSuggestions = new Set();

function formatDate(dateStr) {
  if (!dateStr) return "";
  const [year, month, day] = dateStr.split("-");
  return `${parseInt(day)}-${parseInt(month)}\n${year}`;
}

function openLedger(type){
  currentPath = type;
  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('ledgerScreen').classList.add('active');
  const title = type === 'kharchKhata' ? "खर्चा खाता" : "बैंक खाता";
  document.getElementById('ledgerTitle').innerText = title;
  document.getElementById('printLedgerTitle').innerText = "(" + title + ")";
  loadLedger();
}

function goHome(){
  document.getElementById('ledgerScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
}

function openPopup(){
  document.getElementById("popupForm").style.display = "flex";
  document.getElementById("date").value = new Date().toISOString().split('T')[0];
  document.getElementById("desc").value = "";
  document.getElementById("credit").value = "0";
  document.getElementById("debit").value = "0";
  updateDescList();
}

function closePopup(){
  document.getElementById("popupForm").style.display = "none";
}

function saveNew(){
  const data = {
    date: document.getElementById("date").value,
    desc: document.getElementById("desc").value.trim(),
    credit: Number(document.getElementById("credit").value),
    debit: Number(document.getElementById("debit").value)
  };
  if(!data.desc) return alert("विवरण दर्ज करें!");
  db.ref(currentPath).push(data);
  closePopup();
}

function updateDescList(){
  const list = document.getElementById("descList");
  list.innerHTML = "";
  descSuggestions.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    list.appendChild(option);
  });
}

function loadLedger(){
  db.ref(currentPath).on("value", snap=>{
    allData = snap.val() || {};
    renderTable();
  });
}

function deleteEntry(id) {
  // ⭐ डिलीट करने से पहले कन्फर्मेशन पॉप-अप ⭐
  if (confirm("क्या आप वाकई इस एंट्री को डिलीट करना चाहते हैं?")) {
    db.ref(`${currentPath}/${id}`).remove();
  }
}

function renderTable(){
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;
  const search = document.getElementById("searchBox").value.toLowerCase();
  const sortType = document.getElementById("sortFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;
  const tbody = document.querySelector("#ledgerTable tbody");
  tbody.innerHTML = "";

  let entries = Object.keys(allData).map(id => ({ id, ...allData[id] }));
  
  entries.sort((a, b) => {
    let dateDiff = a.date.localeCompare(b.date);
    if (sortType === "new") {
      dateDiff = b.date.localeCompare(a.date);
      return dateDiff !== 0 ? dateDiff : b.id.localeCompare(a.id);
    } else {
      return dateDiff !== 0 ? dateDiff : a.id.localeCompare(b.id);
    }
  });

  let tc=0, td=0;
  entries.forEach(e => {
    descSuggestions.add(e.desc); 
    if(from && to && (e.date < from || e.date > to)) return;
    if(search && !e.desc.toLowerCase().includes(search)) return;
    if(typeFilter === "credit" && e.credit <= 0) return;
    if(typeFilter === "debit" && e.debit <= 0) return;

    tc += e.credit; td += e.debit;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="td-date">${formatDate(e.date)}</td>
      <td class="customer-name">${e.desc}</td>
      <td class='credit'>${e.credit}</td>
      <td class='debit'>${e.debit}</td>
      <td>
        <button class='edit-btn' onclick="editEntry('${e.id}',${e.credit},${e.debit},'${e.date}','${e.desc.replace(/'/g,"&#39;")}')">✏️</button>
        <button class='delete-btn' onclick="deleteEntry('${e.id}')">🗑️</button>
      </td>`;
    tbody.appendChild(tr);
  });

  document.getElementById("creditTotal").innerText=tc;
  document.getElementById("debitTotal").innerText=td;
  document.getElementById("balance").innerText=tc-td;
  updateMainBalances();
}

function editEntry(id, c, d, dateVal, descVal) {
  openPopup();
  document.getElementById("date").value = dateVal;
  document.getElementById("desc").value = descVal;
  document.getElementById("credit").value = c;
  document.getElementById("debit").value = d;
  document.querySelector(".save-btn").onclick = () => {
    const updated = {
      date: document.getElementById("date").value,
      desc: document.getElementById("desc").value.trim(),
      credit: Number(document.getElementById("credit").value),
      debit: Number(document.getElementById("debit").value)
    };
    db.ref(`${currentPath}/${id}`).update(updated).then(closePopup);
  };
}

function updateMainBalances(){
  ["kharchKhata","bankKhata"].forEach(path=>{
    db.ref(path).once("value",snap=>{
      let tc=0,td=0;
      const data=snap.val()||{};
      Object.values(data).forEach(e=>{tc+=e.credit;td+=e.debit});
      const el = document.getElementById(path==="kharchKhata" ? "kharchBalance" : "bankBalance");
      if(el) el.innerText="₹"+(tc-td);
    });
  });
}

document.getElementById("fromDate").addEventListener("input", renderTable);
document.getElementById("toDate").addEventListener("input", renderTable);
document.getElementById("searchBox").addEventListener("input", renderTable);
document.getElementById("sortFilter").addEventListener("change", renderTable);
document.getElementById("typeFilter").addEventListener("change", renderTable);
updateMainBalances();
</script>
</body>
</html>
